<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            background: linear-gradient(135deg, #0D1B2A 0%, #1A2F4A 100%);
        }
        
        .login-branding {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .login-branding h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #00C9B1;
        }
        
        .login-branding p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 400px;
        }
        
        .login-form-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-color: #F4F6F9;
        }
        
        .login-form {
            width: 100%;
            max-width: 400px;
        }
        
        .login-form h2 {
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .login-form .form-group {
            margin-bottom: 1.5rem;
        }
        
        .login-form .form-control {
            padding: 0.875rem 1rem;
            font-size: 1rem;
        }
        
        .login-form .btn-primary {
            width: 100%;
            margin-top: 1rem;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-muted);
        }
        
        .login-footer a {
            color: var(--accent-teal);
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
            }
            
            .login-branding {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-branding">
            <h1>Digital Attendance</h1>
            <p>Secure, efficient class attendance tracking for modern universities</p>
        </div>
        
        <div class="login-form-container">
            <form class="login-form" id="loginForm">
                <h2>Welcome Back</h2>
                
                <div id="alertContainer"></div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="padding-right: 3rem;">
                        <button type="button" id="togglePassword" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666; padding: 0;">
                            <i data-lucide="eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                
                <div class="login-footer">
                    <p>Don't have an account? <a href="/register">Create one</a></p>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (password.type === 'password') {
                password.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                password.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await API.post('/auth/login', { email, password });
                Toast.success('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } catch (error) {
                const alertContainer = document.getElementById('alertContainer');
                alertContainer.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
