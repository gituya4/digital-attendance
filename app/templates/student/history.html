{% extends "base.html" %}

{% block title %}Attendance History - AttendKU{% endblock %}

{% block content %}
<div class="history-page">
    <div class="page-header">
        <h1>Attendance History</h1>
        <p class="subtitle">View your complete attendance record</p>
    </div>

    <div class="history-controls">
        <div class="filter-group">
            <label for="unit-filter">Filter by Unit:</label>
            <select id="unit-filter" class="form-select">
                <option value="">All Units</option>
            </select>
        </div>
        <button id="export-csv" class="btn btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Export CSV
        </button>
    </div>

    <div class="history-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Unit Code</th>
                    <th>Unit Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="history-tbody">
            </tbody>
        </table>
        <div id="empty-state" class="empty-state" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <h3>No Attendance Records</h3>
            <p>You haven't marked any attendance yet.</p>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const unitFilter = document.getElementById('unit-filter');
    const historyTbody = document.getElementById('history-tbody');
    const emptyState = document.getElementById('empty-state');
    const exportBtn = document.getElementById('export-csv');
    let allAttendance = [];

    async function loadUnits() {
        try {
            const response = await fetch('/api/student/units');
            const data = await response.json();
            if (data.success) {
                data.units.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit.unit_id;
                    option.textContent = `${unit.unit_code} - ${unit.unit_name}`;
                    unitFilter.appendChild(option);
                });
            }
        } catch (error) {
            showToast('Failed to load units', 'error');
        }
    }

    async function loadHistory(unitId = null) {
        try {
            const url = unitId ? `/api/student/attendance?unit_id=${unitId}` : '/api/student/attendance';
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.success) {
                allAttendance = data.attendance;
                renderHistory(data.attendance);
            }
        } catch (error) {
            showToast('Failed to load attendance history', 'error');
        }
    }

    function renderHistory(attendance) {
        historyTbody.innerHTML = '';
        
        if (attendance.length === 0) {
            emptyState.style.display = 'block';
            return;
        }
        
        emptyState.style.display = 'none';
        
        attendance.forEach(record => {
            const row = document.createElement('tr');
            const date = record.marked_at ? new Date(record.marked_at).toLocaleDateString() : 'N/A';
            const statusClass = record.status === 'present' ? 'status-present' : 'status-manual';
            
            row.innerHTML = `
                <td>${date}</td>
                <td>${record.unit_code}</td>
                <td>${record.unit_name}</td>
                <td><span class="status-badge ${statusClass}">${record.status}</span></td>
            `;
            historyTbody.appendChild(row);
        });
    }

    unitFilter.addEventListener('change', function() {
        const unitId = this.value || null;
        loadHistory(unitId);
    });

    exportBtn.addEventListener('click', async function() {
        try {
            const response = await fetch('/api/student/attendance/export');
            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `attendance_history_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                showToast('CSV exported successfully', 'success');
            }
        } catch (error) {
            showToast('Failed to export CSV', 'error');
        }
    });

    loadUnits();
    loadHistory();
});
</script>
{% endblock %}
